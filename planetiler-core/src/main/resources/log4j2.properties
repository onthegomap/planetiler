appenders=console, untimed
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
# Lines start with the time since the run started. Only warnings and errors are tagged (WRN / ERR), and only they get
# color codes, from AnsiColorsContextDataProvider, so they follow --color and NO_COLOR.
appender.console.layout.selector.type=LevelPatternSelector
appender.console.layout.selector.defaultPattern=%X{uptime} %X{stage}%msg%n%throwable
appender.console.layout.selector.warn.type=PatternMatch
appender.console.layout.selector.warn.key=WARN
appender.console.layout.selector.warn.pattern=%X{ansi_yellow}%X{uptime} %level{length=3} %X{stage}%msg%X{ansi_reset}%n%throwable
appender.console.layout.selector.error.type=PatternMatch
appender.console.layout.selector.error.key=ERROR
appender.console.layout.selector.error.pattern=%X{ansi_red}%X{uptime} %level{length=3} %X{stage}%msg%X{ansi_reset}%n%throwable
appender.console.layout.selector.fatal.type=PatternMatch
appender.console.layout.selector.fatal.key=FATAL
appender.console.layout.selector.fatal.pattern=%X{ansi_red}%X{uptime} %level{length=3} %X{stage}%msg%X{ansi_reset}%n%throwable
# What a run prints before its first timed line and after its last one, and problems with the options or inputs that
# stop it from starting (LogUtil.UNTIMED_LOGGER)
appender.untimed.type=Console
appender.untimed.name=UNTIMED
appender.untimed.layout.type=PatternLayout
appender.untimed.layout.selector.type=LevelPatternSelector
appender.untimed.layout.selector.defaultPattern=%msg%n%throwable
appender.untimed.layout.selector.warn.type=PatternMatch
appender.untimed.layout.selector.warn.key=WARN
appender.untimed.layout.selector.warn.pattern=%X{ansi_yellow}%level %msg%X{ansi_reset}%n%throwable
appender.untimed.layout.selector.error.type=PatternMatch
appender.untimed.layout.selector.error.key=ERROR
appender.untimed.layout.selector.error.pattern=%X{ansi_red}%level %msg%X{ansi_reset}%n%throwable
logger.untimed.name=untimed
logger.untimed.additivity=false
logger.untimed.appenderRef.untimed.ref=UNTIMED

# --verbose switches to debug, --quiet to warn (LogUtil.setLevel)
rootLogger.level=info
rootLogger.appenderRefs=stdout
rootLogger.appenderRef.stdout.ref=STDOUT

logger.apache.name=org.apache
logger.apache.level=warn

# suppress warning about unreadable duckdb statistics
logger.apachecorrupt.name=org.apache.parquet.CorruptStatistics
logger.apachecorrupt.level=error
