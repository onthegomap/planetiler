version: 2
project_name: planetiler

before:
  hooks:
  - bash scripts/build-runtimes.sh

builds:
- id: planetiler
  dir: launcher
  binary: planetiler
  env: [ CGO_ENABLED=0 ]
  flags: [ -trimpath ]
  ldflags: [ "-s -w" ]
  goos: [ linux, darwin, windows ]
  goarch: [ amd64, arm64 ]
  ignore:
  - goos: windows
    goarch: arm64

archives:
- id: zip
  ids: [ planetiler ]
  formats: [ tar.gz ]
  format_overrides:
  - goos: windows
    formats: [ zip ]
  name_template: >-
    {{ .ProjectName }}_{{ .Version }}_
    {{- title .Os }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else }}{{ .Arch }}{{ end }}
  files: [ "none*" ]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: [ "^docs:", "^test:" ]

release:
  prerelease: auto
