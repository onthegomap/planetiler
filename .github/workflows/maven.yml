# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  # When spotless:apply fails, the error message is a bit cryptic, so try to make it obvious that
  # is the problem by putting the check into a standalone job
  lint:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: 'maven'
    - name: Ensure code formatted with mvn spotless:apply
      run: ./mvnw -DskipTests --batch-mode -no-transfer-progress spotless:check

  build:
    name: Java ${{ matrix.jdk }} / ${{ matrix.os }} ${{ matrix.args }}
    # Wait until after we check that you ran mvn spotless:apply, otherwise will fail with a cryptic error message
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        jdk: [ 25, 27 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
        cache: 'maven'
    # Skip spotless since that gets checked in a separate task
    - name: Build with mvnw (linux/mac)
      if: ${{ !contains(matrix.os, 'windows') }}
      run: ./mvnw ${{matrix.args}} -Dspotless.check.skip --batch-mode -no-transfer-progress verify jib:buildTar --file pom.xml
    - name: Build with mvnw.cmd (windows)
      if: ${{ contains(matrix.os, 'windows') }}
      run: mvnw.cmd ${{matrix.args}} -Dspotless.check.skip --batch-mode -no-transfer-progress verify jib:buildTar --file pom.xml
      shell: cmd

  examples:
    name: Example project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
    - name: Build and test
      run: mvn --batch-mode -no-transfer-progress package --file standalone.pom.xml
      working-directory: planetiler-examples
    - name: Find jar
      run: mv target/*with-deps.jar ./run.jar
      working-directory: planetiler-examples
    - name: Run
      run: java -jar run.jar --osm-path=../planetiler-core/src/test/resources/monaco-latest.osm.pbf --output=data/out.mbtiles
      working-directory: planetiler-examples
    - name: Verify
      run: java -cp run.jar com.onthegomap.planetiler.mbtiles.Verify data/out.mbtiles
      working-directory: planetiler-examples

  run:
    name: Build / Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Cache data/sources
      uses: ./.github/cache-sources-action
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: 'maven'

    - name: Build this branch
      run: ./mvnw -DskipTests -Dimage.version=CI_ONLY --batch-mode -no-transfer-progress package jib:dockerBuild --file pom.xml

    - name: 'Upload artifact'
      uses: actions/upload-artifact@v7
      with:
        name: planetiler-build
        path: planetiler-dist/target/*with-deps.jar

    - id: month
      run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

    # JDK + jmods downloads (~1 GB). The month in the key means a newer JDK release
    # gets picked up about once a month; the Makefile caches the chosen tag in here too.
    - uses: actions/cache@v4
      with:
        path: launcher/.cache
        key: jdk-${{ steps.month.outputs.value }}

    - run: make -C launcher JAR="$(realpath planetiler-dist/target/*with-deps.jar)"

    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/planetiler_*_linux_amd64.tar.gz, archive: false }
    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/planetiler_*_linux_arm64.tar.gz, archive: false }
    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/planetiler_*_darwin_amd64.tar.gz, archive: false }
    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/planetiler_*_darwin_arm64.tar.gz, archive: false }
    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/planetiler_*_windows_amd64.zip, archive: false }
    - uses: actions/upload-artifact@v7
      with: { path: launcher/dist/checksums.txt, archive: false }

    - name: Download data (java)
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        max_attempts: 5
        timeout_minutes: 30
        command: java -jar planetiler-dist/target/*with-deps.jar --only-download --area=monaco

    - name: Download wikidata (java)
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        max_attempts: 5
        timeout_minutes: 30
        command: java -jar planetiler-dist/target/*with-deps.jar --only-fetch-wikidata --area=monaco

    - name: Verify build
      run: ./scripts/test-release.sh CI_ONLY
      env:
        SKIP_EXAMPLE_PROJECT: true

  smoke-macos:
    needs: run
    runs-on: macos-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: planetiler_*_darwin_arm64.tar.gz
        merge-multiple: true
        path: dist
    - run: ls -R dist
      shell: bash
    - name: Smoke test
      run: |
        set -euxo pipefail
        mkdir t && cd t
        tar -xzf ../dist/planetiler_*_darwin_arm64.tar.gz
        ./planetiler --jvm-args=-version 2>&1 | grep -i openjdk
        ./planetiler --extract-jar && test -s planetiler.jar
        ./planetiler --download --area=monaco --output=monaco.mbtiles --only-layers=poi
        test -s monaco.mbtiles

  smoke-windows:
    needs: run
    runs-on: windows-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: planetiler_*_windows_amd64.zip
        merge-multiple: true
        path: dist
    - run: ls -R dist
      shell: bash
    - name: Smoke test
      shell: bash
      run: |
        set -euxo pipefail
        mkdir t && cd t
        mv ../dist/planetiler.exe ./planetiler.exe || unzip ../dist/planetiler_*_windows_amd64.zip
        ./planetiler.exe --jvm-args=-version 2>&1 | grep -i openjdk
        ./planetiler.exe --extract-jar && test -s planetiler.jar
        ./planetiler.exe --download --area=monaco --output=monaco.mbtiles --only-layers=poi
        test -s monaco.mbtiles

  quickstart:
    name: Quickstart script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Cache data/sources
      uses: ./.github/cache-sources-action
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: 'maven'

    - name: quickstart.sh --build
      run: rm -rf data/output.mbtiles data/tmp && ./quickstart.sh monaco --build && ./scripts/check-monaco.sh data/output.mbtiles
    - name: quickstart.sh --jar
      run: rm -rf data/output.mbtiles data/tmp && ./quickstart.sh monaco --jar && ./scripts/check-monaco.sh data/output.mbtiles
    # run docker last since it creates temp dirs with root user
    - name: quickstart.sh --docker
      run: rm -rf data/output.mbtiles data/tmp && ./quickstart.sh monaco --docker && ./scripts/check-monaco.sh data/output.mbtiles
