# This workflow builds a map using the base and branch commit of a PR and uploads
# the logs as an artifact that update-pr.yml uses to add back as a comment.

name: Publish a Snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tags:
        description: 'Extra docker image tags ("latest,test")'
        required: true
        default: 'latest,snapshot'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Cache data/sources
      uses: ./.github/cache-sources-action
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase: OSSRH_GPG_SECRET_KEY_PASSWORD
    - run: ./scripts/build-release.sh
    - name: 'Test release'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        max_attempts: 5
        timeout_minutes: 30
        command: ./scripts/test-release.sh
    - run: sha256sum planetiler-dist/target/*with-deps.jar
    - run: md5sum planetiler-dist/target/*with-deps.jar
    - name: 'Upload artifact'
      uses: actions/upload-artifact@v7
      with:
        name: planetiler-build
        path: planetiler-dist/target/*with-deps.jar
    - run: ./scripts/push-release.sh
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_TAGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tags || 'latest,snapshot' }}
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

  publish-latest:
    needs: snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-latest-main
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: planetiler-build
        path: build-jar
    - uses: actions/cache@v6
      with:
        path: launcher/.cache
        key: jdk-${{ hashFiles('launcher/Makefile') }}
    - name: Build launchers
      run: make -C launcher VERSION=snapshot JAR="$(realpath build-jar/*with-deps.jar)"
    - name: Publish rolling release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euxo pipefail
        cp build-jar/*with-deps.jar launcher/dist/planetiler.jar
        # point the tag at this commit (no-op for watchers; only publishing a release notifies)
        git tag -f latest-main "$GITHUB_SHA"
        git push -f origin latest-main
        cd launcher/dist
        sha256sum planetiler* > checksums.txt
        notes="Automated, unreleased build of ${GITHUB_SHA}. Experimental; use a tagged release for production."
        if gh release view latest-main >/dev/null 2>&1; then
          gh release upload latest-main * --clobber
          gh release edit latest-main --notes "$notes"
        else
          gh release create latest-main * --prerelease --verify-tag \
            --title "Latest main build" --notes "$notes"
        fi
